name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Repeated pushes to a PR queue redundant lint and test-matrix runs; cancel
# superseded runs on PRs but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The generator emits different code for effect v3 vs v4. Run the full
    # integration suite against both. tests/package.json pins the effect v4
    # line; the v3 leg replaces effect, @effect/vitest and vitest in tests/.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: effect-v3
            install: "effect@^3.19 @effect/vitest@^0.27 vitest@^3.2"
          - name: effect-v4
            install: ""

    name: test (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install test fixtures (${{ matrix.name }})
        # effect, @effect/vitest and vitest must be one matching set, so all
        # three live in tests/ (@effect/vitest for effect v3 needs vitest 3,
        # for v4 vitest 5). --legacy-peer-deps keeps npm from adding peers
        # that the fixtures do not need.
        run: cd tests && npm install --no-save --no-package-lock --legacy-peer-deps ${{ matrix.install }}

      - name: Run tests
        run: npm test
